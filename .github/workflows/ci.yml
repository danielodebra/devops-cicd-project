name: Homelab Status CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homelab-status
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Ubuntu Server
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOMELAB_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/homelab_deploy
          chmod 600 ~/.ssh/homelab_deploy

      - name: Deploy application with rollback
        env:
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          set -euo pipefail

          ssh-keyscan -H "$HOMELAB_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/homelab_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$HOMELAB_USER@$HOMELAB_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          CONTAINER_NAME="homelab-status"
          IMAGE="ghcr.io/danielodebra/homelab-status:latest"

          # Remember the image used by the current container.
          PREVIOUS_IMAGE_ID="$(docker inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)"

          # Pull the new image before touching the running container.
          docker pull "$IMAGE"

          rollback() {
            echo "Deployment failed. Attempting rollback..."

            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if [ -z "$PREVIOUS_IMAGE_ID" ]; then
              echo "No previous image is available for rollback."
              return 1
            fi

            if ! docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 8000:8000 \
              "$PREVIOUS_IMAGE_ID"; then
              echo "Failed to start the previous container image."
              return 1
            fi

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
                echo
                echo "Previous version restored successfully."
                return 0
              fi

              echo "Rollback health check attempt $attempt failed."
              sleep 5
            done

            echo "Rollback failed: previous version did not become healthy."
            return 1
          }

          # Replace the running container with the new image.
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if ! docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"; then
            echo "New container failed to start."
            rollback || true
            exit 1
          fi

          # Verify the new deployment.
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              echo
              echo "New deployment is healthy."
              exit 0
            fi

            echo "Health check attempt $attempt failed."
            sleep 5
          done

          echo "New deployment failed its health checks."
          rollback || true
          exit 1
          REMOTE
