name: Homelab Status CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homelab-status
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Ubuntu Server
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOMELAB_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/homelab_deploy
          chmod 600 ~/.ssh/homelab_deploy

      - name: Deploy application
        env:
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          set -euo pipefail

          ssh-keyscan -H "$HOMELAB_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/homelab_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$HOMELAB_USER@$HOMELAB_HOST" \
            'set -e
             docker pull ghcr.io/danielodebra/homelab-status:latest
             docker stop homelab-status
             docker rm homelab-status
             docker run -d \
               --name homelab-status \
               --restart unless-stopped \
               -p 8000:8000 \
               ghcr.io/danielodebra/homelab-status:latest'

      - name: Verify application health
        env:
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST }}
          HOMELAB_USER: ${{ secrets.HOMELAB_USER }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 12); do
            if ssh \
              -i ~/.ssh/homelab_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$HOMELAB_USER@$HOMELAB_HOST" \
              'curl --fail --silent --show-error http://127.0.0.1:8000/health'
            then
              echo "Deployment health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying..."
            sleep 5
          done

          echo "Deployment health check failed."
          exit 1
